<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Brief Lab</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app-shell">

    <!-- ── Dark sidebar ── -->
    <aside id="sidebar">

      <div class="sb-header">
        <div class="sb-logo-row">
          <div class="sb-logo-icon">C</div>
          <span class="sb-logo-text">College Brief Lab</span>
        </div>
      </div>

      <div class="sb-user" id="sb-user">
        <button id="btn-sign-in" class="btn-signin-sidebar">Sign in with Google</button>
      </div>

      <nav class="sb-nav" id="sb-nav">
        <button class="sb-nav-item" data-view="dashboard">
          <span class="sb-nav-dot"></span>Dashboard
        </button>
        <button class="sb-nav-item" data-view="briefs">
          <span class="sb-nav-dot"></span>Brief Builder
        </button>
        <button class="sb-nav-item" data-view="opportunities">
          <span class="sb-nav-dot"></span>Opportunities
        </button>
      </nav>

      <div class="sb-footer" id="sb-footer">
        <!-- populated by JS when signed in -->
      </div>

    </aside>

    <!-- ── Main content ── -->
    <main id="app-main"></main>

  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
